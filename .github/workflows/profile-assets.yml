name: Refresh profile landscape

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_profile.py
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build assets from actual contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_profile.py --username "$GITHUB_REPOSITORY_OWNER"
      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution landscape [skip ci]"
            git pull --rebase origin main
            git push
          fi
