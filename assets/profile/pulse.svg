<svg xmlns="http://www.w3.org/2000/svg" width="590" height="326" viewBox="0 0 590 326" role="img" aria-labelledby="title desc">
<title id="title">Pulse — Every signal. One clear view.</title><desc id="desc">Every signal. One clear view. Website health, performance &amp; visitor analytics. Stack: REACT / TYPESCRIPT / FASTAPI</desc>
<defs>
<radialGradient id="glow"><stop stop-color="#477f5c" stop-opacity=".25"/><stop offset="1" stop-color="#0c1110" stop-opacity="0"/></radialGradient>
</defs>
<style>
 text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
 .pulse {animation:pulse 4s ease-in-out infinite;}
 .rise {animation:rise 1.8s cubic-bezier(.2,.7,.3,1) both;}
 .drift {animation:drift 7s ease-in-out infinite;}
 .trace {stroke-dasharray:90 600;animation:trace 7s linear infinite;}
 @keyframes pulse {0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes rise {from{opacity:.7;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
 @keyframes drift {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes trace {to{stroke-dashoffset:-690}}
 @media(prefers-reduced-motion:reduce){.pulse,.rise,.drift,.trace{animation:none;}}
</style>
<rect x=".5" y=".5" width="589" height="325" rx="22" fill="#0c1110" stroke="#28392f"/>
<text x="30" y="39" fill="#c7b8ff" font-size="11" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >01 / OBSERVABILITY</text><text x="542" y="42" fill="#c7b8ff" font-size="25" font-weight="400" >↗</text><text x="29" y="104" fill="#edf5ef" font-size="48" font-weight="600" letter-spacing="-2">Pulse</text><text x="31" y="144" fill="#a3b7aa" font-size="17" font-weight="400" >Every signal. One clear view.</text><text x="31" y="170" fill="#a3b7aa" font-size="17" font-weight="400" >Website health, performance &amp; visitor analytics.</text><rect x="30" y="199" width="530" height="67" rx="12" fill="#142019"/><path d="M48 234 H100 L112 224 L125 245 L142 211 L158 253 L174 233 H219 L233 225 L248 241 L265 219 L281 234 H342 L357 228 L371 240 L389 216 L405 247 L423 234 H542" fill="none" stroke="#c7b8ff" stroke-width="2" opacity=".25"/><path class="trace" d="M48 234 H100 L112 224 L125 245 L142 211 L158 253 L174 233 H219 L233 225 L248 241 L265 219 L281 234 H342 L357 228 L371 240 L389 216 L405 247 L423 234 H542" fill="none" stroke="#c7b8ff" stroke-width="2.5"/><text x="31" y="301" fill="#a3b7aa" font-size="11" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >REACT / TYPESCRIPT / FASTAPI</text>
</svg>
