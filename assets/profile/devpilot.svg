<svg xmlns="http://www.w3.org/2000/svg" width="590" height="326" viewBox="0 0 590 326" role="img" aria-labelledby="title desc">
<title id="title">DevPilot — From a reproducible bug to a reviewed patch.</title><desc id="desc">From a reproducible bug to a reviewed patch. AI-assisted Python debugging with test evidence. Stack: PYTHON / LANGGRAPH / GROQ</desc>
<defs>
<radialGradient id="glow"><stop stop-color="#477f5c" stop-opacity=".25"/><stop offset="1" stop-color="#0c1110" stop-opacity="0"/></radialGradient>
</defs>
<style>
 text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
 .pulse {animation:pulse 4s ease-in-out infinite;}
 .rise {animation:rise 1.8s cubic-bezier(.2,.7,.3,1) both;}
 .drift {animation:drift 7s ease-in-out infinite;}
 .trace {stroke-dasharray:90 600;animation:trace 7s linear infinite;}
 @keyframes pulse {0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes rise {from{opacity:.7;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
 @keyframes drift {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes trace {to{stroke-dashoffset:-690}}
 @media(prefers-reduced-motion:reduce){.pulse,.rise,.drift,.trace{animation:none;}}
</style>
<rect x=".5" y=".5" width="589" height="325" rx="22" fill="#0c1110" stroke="#28392f"/>
<text x="30" y="39" fill="#a8f0c2" font-size="11" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >02 / AGENTIC AI</text><text x="542" y="42" fill="#a8f0c2" font-size="25" font-weight="400" >↗</text><text x="29" y="104" fill="#edf5ef" font-size="48" font-weight="600" letter-spacing="-2">DevPilot</text><text x="31" y="144" fill="#a3b7aa" font-size="17" font-weight="400" >From a reproducible bug to a reviewed patch.</text><text x="31" y="170" fill="#a3b7aa" font-size="17" font-weight="400" >AI-assisted Python debugging with test evidence.</text><rect x="30" y="199" width="530" height="67" rx="12" fill="#142019"/><path d="M90 221 H490" stroke="#3c5f49"/><circle cx="90" cy="221" r="5" fill="#a8f0c2" class="pulse" style="animation-delay:0.0s"/><text x="90" y="249" fill="#a3b7aa" font-size="9" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">REPRODUCE</text><circle cx="222" cy="221" r="5" fill="#a8f0c2" class="pulse" style="animation-delay:0.7s"/><text x="222" y="249" fill="#a3b7aa" font-size="9" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">INVESTIGATE</text><circle cx="354" cy="221" r="5" fill="#a8f0c2" class="pulse" style="animation-delay:1.4s"/><text x="354" y="249" fill="#a3b7aa" font-size="9" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">TEST</text><circle cx="486" cy="221" r="5" fill="#a8f0c2" class="pulse" style="animation-delay:2.0999999999999996s"/><text x="486" y="249" fill="#a3b7aa" font-size="9" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">REVIEW</text><text x="31" y="301" fill="#a3b7aa" font-size="11" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >PYTHON / LANGGRAPH / GROQ</text>
</svg>
