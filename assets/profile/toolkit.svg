<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">The toolkit</title><desc id="desc">INTELLIGENCE: Python · PyTorch · scikit-learn, LLMs · RAG · Computer vision | PRODUCT: React · Next.js · TypeScript, Tailwind CSS · Motion | SYSTEMS: FastAPI · Spring Boot, PostgreSQL · Docker · Git</desc>
<defs>
<radialGradient id="glow"><stop stop-color="#477f5c" stop-opacity=".25"/><stop offset="1" stop-color="#0c1110" stop-opacity="0"/></radialGradient>
</defs>
<style>
 text {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
 .pulse {animation:pulse 4s ease-in-out infinite;}
 .rise {animation:rise 1.8s cubic-bezier(.2,.7,.3,1) both;}
 .drift {animation:drift 7s ease-in-out infinite;}
 .trace {stroke-dasharray:90 600;animation:trace 7s linear infinite;}
 @keyframes pulse {0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes rise {from{opacity:.7;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
 @keyframes drift {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes trace {to{stroke-dashoffset:-690}}
 @media(prefers-reduced-motion:reduce){.pulse,.rise,.drift,.trace{animation:none;}}
</style>
<rect x=".5" y=".5" width="1199" height="179" rx="22" fill="#0c1110" stroke="#28392f"/>
<text x="35" y="39" fill="#a8f0c2" font-size="12" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >THE TOOLKIT / FROM IDEA TO INTERFACE</text><text x="35" y="87" fill="#a3b7aa" font-size="11" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >INTELLIGENCE</text><text x="35" y="119" fill="#edf5ef" font-size="18" font-weight="400" >Python · PyTorch · scikit-learn</text><text x="35" y="146" fill="#edf5ef" font-size="18" font-weight="400" >LLMs · RAG · Computer vision</text><text x="435" y="87" fill="#a3b7aa" font-size="11" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >PRODUCT</text><text x="435" y="119" fill="#edf5ef" font-size="18" font-weight="400" >React · Next.js · TypeScript</text><text x="435" y="146" fill="#edf5ef" font-size="18" font-weight="400" >Tailwind CSS · Motion</text><text x="835" y="87" fill="#a3b7aa" font-size="11" font-weight="400" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" >SYSTEMS</text><text x="835" y="119" fill="#edf5ef" font-size="18" font-weight="400" >FastAPI · Spring Boot</text><text x="835" y="146" fill="#edf5ef" font-size="18" font-weight="400" >PostgreSQL · Docker · Git</text><path d="M401 72 V153 M801 72 V153" stroke="#28392f"/>
</svg>
